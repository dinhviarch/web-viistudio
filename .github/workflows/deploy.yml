# Mỗi lần push lên nhánh main: build website và upload thư mục dist/ lên htdocs của InfinityFree qua FTP.
# Cần khai báo trong GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER (vd: ftpupload.net), FTP_USERNAME (vd: if0_12345678), FTP_PASSWORD
#   Variables: SITE_URL (vd: https://viin.infinityfreeapp.com), FORM_ENDPOINT (tuỳ chọn)

name: Deploy lên InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}

      - name: Upload qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /htdocs/
